# Local development stack — report §14.1 ("Docker-based local development")
# and §11.1, which keeps the API, worker and web as separate processes from the
# same image so local topology matches production.
#
#   docker compose up -d db minio        # dependencies only, run apps on host
#   docker compose --profile app up      # everything in containers
#
# MinIO stands in for S3-compatible private object storage. The bucket is
# private; the application issues short-lived signed URLs (report §9.7).

name: extrawork

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: extrawork
      # C collation keeps index behaviour identical across developer machines.
      POSTGRES_INITDB_ARGS: '--locale=C --encoding=UTF8'
    ports:
      - '5432:5432'
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./infra/docker/init-db.sql:/docker-entrypoint-initdb.d/10-init.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d extrawork']
      interval: 5s
      timeout: 5s
      retries: 20

  minio:
    image: minio/minio:RELEASE.2024-10-13T13-34-11Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: extrawork
      MINIO_ROOT_PASSWORD: extrawork-dev-secret
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - minio-data:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 5s
      retries: 20

  # Creates the private bucket once and exits. Public access is never granted.
  minio-init:
    image: minio/mc:RELEASE.2024-10-08T09-37-26Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 extrawork extrawork-dev-secret &&
      mc mb --ignore-existing local/extrawork &&
      mc anonymous set none local/extrawork &&
      mc version enable local/extrawork &&
      echo 'bucket ready (private, versioned)'
      "

  mailpit:
    image: axllent/mailpit:v1.21
    restart: unless-stopped
    ports:
      - '1025:1025' # SMTP
      - '8025:8025' # web UI
    environment:
      MP_MAX_MESSAGES: '500'

  # --- Application processes (opt in with --profile app) ------------------

  api:
    profiles: ['app']
    build:
      context: .
      dockerfile: infra/docker/Dockerfile
      target: server
    command: ['node', 'apps/api/dist/server.js']
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment: &app-env
      NODE_ENV: production
      APP_ENV: local
      DATABASE_URL: postgres://postgres:postgres@db:5432/extrawork
      API_HOST: 0.0.0.0
      API_PORT: '4000'
      API_PUBLIC_URL: http://localhost:4000
      WEB_PUBLIC_URL: http://localhost:3000
      CORS_ALLOWED_ORIGINS: http://localhost:3000
      SESSION_SECRET: dev-session-secret-not-for-production-use
      PRIVACY_HASH_SECRET: dev-privacy-secret-not-for-production-use
      STORAGE_URL_SECRET: dev-storage-secret-not-for-production-use
      STORAGE_DRIVER: s3
      STORAGE_BUCKET: extrawork
      STORAGE_ENDPOINT: http://minio:9000
      STORAGE_ACCESS_KEY_ID: extrawork
      STORAGE_SECRET_ACCESS_KEY: extrawork-dev-secret
      STORAGE_FORCE_PATH_STYLE: 'true'
      EMAIL_DRIVER: smtp
      SMTP_URL: smtp://mailpit:1025
      WHATSAPP_DRIVER: native-share
      AUTH_DRIVER: local
      LOG_LEVEL: info
    ports:
      - '4000:4000'
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:4000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 10

  worker:
    profiles: ['app']
    build:
      context: .
      dockerfile: infra/docker/Dockerfile
      target: worker
    command: ['node', 'apps/worker/dist/main.js']
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      <<: *app-env

  web:
    profiles: ['app']
    build:
      context: .
      dockerfile: infra/docker/Dockerfile
      target: web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: http://localhost:4000
    ports:
      - '3000:3000'

volumes:
  db-data:
  minio-data:
